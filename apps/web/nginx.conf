server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Same-origin API: apps/web/src/api-url.ts calls relative "/api/..." paths
    # in web mode, so this proxy is what makes the build work with zero
    # frontend changes. "api" is the compose service name (Docker DNS).
    location /api/ {
        proxy_pass http://api:8888/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback for react-router-dom client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
