# Docker's embedded DNS, short TTL: a plain `proxy_pass http://api:8888` resolves
# "api" once at nginx startup and caches that IP for the worker's lifetime, so
# recreating the api container (new IP) leaves nginx proxying to a dead address
# until nginx itself restarts — this bit a real deploy (502s after `docker compose
# up -d api`). Routing proxy_pass through a variable forces per-request resolution
# instead, respecting this resolver's TTL.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    set $api_upstream http://api:8888;

    # Server-Sent Events (apps/api/src/events.ts): must not be buffered — buffering
    # would hold each push until nginx's buffer fills, defeating "real-time" — and
    # needs a read timeout past the server's 20s keep-alive ping or nginx closes the
    # connection as idle (the client reconnects either way, but that's unnecessary churn).
    location /api/portfolio/events {
        # A variable proxy_pass target drops the matched URI unless $request_uri is
        # appended explicitly — without it nginx forwards only the literal path
        # written here, not the actual incoming request path.
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 90s;
    }

    # Same-origin API: apps/web/src/api-url.ts calls relative "/api/..." paths
    # in web mode, so this proxy is what makes the build work with zero
    # frontend changes. "api" is the compose service name (Docker DNS).
    location /api/ {
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback for react-router-dom client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
