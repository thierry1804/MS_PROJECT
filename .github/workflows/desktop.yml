name: Desktop build

on:
  push:
    branches: [main, master]
    paths:
      - "apps/desktop/**"
      - "apps/web/**"
      - "apps/api/**"
      - "packages/**"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/web/**"
      - "apps/api/**"
      - "packages/**"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install
      - run: pnpm --filter @atelier/api db:generate
      - run: pnpm typecheck
      - run: pnpm --filter @atelier/web build
      - run: pnpm --filter @atelier/api bundle
      - run: pnpm --filter @atelier/desktop build
        env:
          TAURI_ENV_PLATFORM: linux

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: pnpm install
      - run: pnpm --filter @atelier/api db:generate
      - run: pnpm typecheck
      - run: pnpm --filter @atelier/web build
      - run: pnpm --filter @atelier/api bundle
      - run: pnpm --filter @atelier/desktop build
        env:
          TAURI_ENV_PLATFORM: windows
